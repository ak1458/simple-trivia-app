<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="description" content="An interactive joke page with a dodging No button">
    <meta name="theme-color" content="#fff3f5" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#1a0a10" media="(prefers-color-scheme: dark)">
    <title>A Simple Question...</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header class="topbar">
        <span class="brand">a simple question</span>
        <span class="tally" id="tally" aria-live="polite">No has escaped <b id="tallyCount">0</b> times</span>
    </header>

    <main class="playground" id="playground">
        <figure class="sticker" aria-hidden="true">
            <div class="sticker-frame">
                <iframe src="https://tenor.com/embed/10532535631716456360" tabindex="-1" title="Waiting sticker"></iframe>
            </div>
            <figcaption>me, waiting for your answer</figcaption>
        </figure>

        <div class="copy">
            <h1 class="question" id="question">Do you <em>love</em> me?</h1>
            <p class="hint" id="hint">Take your time. There is a right answer.</p>
        </div>

        <div class="button-container">
            <button class="btn-yes" id="btnYes" aria-label="Answer Yes">Yes! 💖</button>
            <button class="btn-no" id="btnNo" aria-label="Answer No">No</button>
        </div>
    </main>

    <!-- Modal Overlay -->
    <div class="modal-overlay" id="modalOverlay" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
        <div class="modal">
            <button class="modal-close" id="modalClose" aria-label="Close dialog">&times;</button>
            <div class="modal-icon" id="modalIcon"></div>
            <h2 class="modal-title" id="modalTitle">Yay!</h2>
            <p class="modal-message" id="modalMessage">I knew you'd say yes! 💕</p>
            <button class="modal-button" id="modalButton">Ask me again</button>
        </div>
    </div>

    <div id="preloadContainer"
        style="position: absolute; width: 0; height: 0; overflow: hidden; opacity: 0; pointer-events: none;"></div>
    <script src="script.js"></script>
</body>

</html>
